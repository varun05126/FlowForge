<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowForge - Workflow Builder</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>FlowForge</h1>
            <p>Turn plain-English requests into automated workflows</p>
        </header>
        
        <main>
            <section class="workflow-builder">
                <h2>Create Workflow</h2>
                <div class="input-group">
                    <label for="nl-request">Describe your workflow in plain English:</label>
                    <textarea id="nl-request" rows="4" placeholder="e.g., Get daily attendance from college ERP and email me the summary"></textarea>
                </div>
                <button id="parse-btn">Parse Request</button>
            </section>
            
            <section class="workflow-preview" id="workflow-preview">
                <h2>Workflow Preview</h2>
                <div id="preview-content">
                    <!-- Workflow JSON or visualization will appear here -->
                </div>
            </section>
        </main>
        
        <footer>
            <p>&copy; 2026 FlowForge. All rights reserved.</p>
        </footer>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
