<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1200" xmlns="http://www.w3.org/2000/svg">
  <!-- Styles -->
  <defs>
    <style type="text/css"><![CDATA[
      .box { rx: 12; ry: 12; }
      .step1 { fill: #E3F2FD; stroke: #1565C0; stroke-width: 3; }
      .step2 { fill: #F3E5F5; stroke: #6A1B9A; stroke-width: 3; }
      .step3 { fill: #FFF8E1; stroke: #F57F17; stroke-width: 3; }
      .step4 { fill: #E8F5E9; stroke: #2E7D32; stroke-width: 3; }
      .step5 { fill: #FFEBEE; stroke: #C62828; stroke-width: 3; }
      .step6 { fill: #E1F5FE; stroke: #01579B; stroke-width: 3; }
      .step7 { fill: #F5F5F5; stroke: #9E9E9E; stroke-width: 3; }
      .text { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #212121; }
      .step-number { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: bold; fill: #212121; }
      .arrow { fill: none; stroke: #757575; stroke-width: 3; marker-end: url(#arrowhead); }
      .arrow-loop { fill: none; stroke: #757575; stroke-width: 3; marker-end: url(#arrowhead); stroke-dasharray: 8,8; }
    ]]></style>
    <marker id="arrowhead" markerWidth="12" markerHeight="9" refX="12" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#757575" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="50" class="step-number" text-anchor="middle">Request-to-Execution Flow</text>

  <!-- Step 1: User Input -->
  <rect x="400" y="100" width="200" height="100" class="box step1" />
  <text x="500" y="150" class="step-number" text-anchor="middle">1</text>
  <text x="500" y="180" class="text" text-anchor="middle">User types natural-language request</text>
  <text x="500" y="210" class="text" text-anchor="middle">(e.g. "get daily attendance from college ERP")</text>

  <!-- Step 2: NL Parser -->
  <rect x="400" y="250" width="200" height="100" class="box step2" />
  <text x="500" y="300" class="step-number" text-anchor="middle">2</text>
  <text x="500" y="330" class="text" text-anchor="middle">NL Parser extracts trigger, source, conditions, action</text>

  <!-- Step 3: Clarifying Questions -->
  <rect x="400" y="400" width="200" height="100" class="box step3" />
  <text x="500" y="450" class="step-number" text-anchor="middle">3</text>
  <text x="500" y="480" class="text" text-anchor="middle">Clarifying questions loop back to user if info is missing</text>
  <text x="500" y="510" class="text" text-anchor="middle">(credentials, schedule, channel)</text>

  <!-- Step 4: Structured Workflow JSON -->
  <rect x="400" y="550" width="200" height="100" class="box step4" />
  <text x="500" y="600" class="step-number" text-anchor="middle">4</text>
  <text x="500" y="630" class="text" text-anchor="middle">Structured workflow JSON is generated</text>

  <!-- Step 5: Save and Schedule -->
  <rect x="400" y="700" width="200" height="100" class="box step5" />
  <text x="500" y="750" class="step-number" text-anchor="middle">5</text>
  <text x="500" y="780" class="text" text-anchor="middle">Workflow is saved and scheduled</text>

  <!-- Step 6: Execution Engine -->
  <rect x="400" y="850" width="200" height="100" class="box step6" />
  <text x="500" y="900" class="step-number" text-anchor="middle">6</text>
  <text x="500" y="930" class="text" text-anchor="middle">Execution engine runs it on trigger → fetches data → processes → delivers output</text>

  <!-- Step 7: Storage and Notification -->
  <rect x="400" y="1000" width="200" height="100" class="box step7" />
  <text x="500" y="1050" class="step-number" text-anchor="middle">7</text>
  <text x="500" y="1080" class="text" text-anchor="middle">Result/logs stored, user notified</text>

  <!-- Arrows -->
  <!-- Step 1 to Step 2 -->
  <line x1="500" y1="200" x2="500" y2="250" class="arrow" />
  <!-- Step 2 to Step 3 -->
  <line x1="500" y1="350" x2="500" y2="400" class="arrow" />
  <!-- Step 3 to Step 4 -->
  <line x1="500" y1="500" x2="500" y2="550" class="arrow" />
  <!-- Step 4 to Step 5 -->
  <line x1="500" y1="650" x2="500" y2="700" class="arrow" />
  <!-- Step 5 to Step 6 -->
  <line x1="500" y1="800" x2="500" y2="850" class="arrow" />
  <!-- Step 6 to Step 7 -->
  <line x1="500" y1="950" x2="500" y2="1000" class="arrow" />
  <!-- Loop from Step 3 back to Step 1 (dashed line) -->
  <path d="M 400 450 L 100 450 L 100 150 L 700 150 L 600 200" fill="none" stroke="#757575" stroke-width="3" marker-end="url(#arrowhead)" stroke-dasharray: 8,8;" />
  </svg>
