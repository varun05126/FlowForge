<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Styles -->
  <defs>
    <style type="text/css"><![CDATA[
      .box { rx: 12; ry: 12; }
      .frontend { fill: #E3F2FD; stroke: #1565C0; stroke-width: 3; }
      .backend { fill: #E8F5E9; stroke: #2E7D32; stroke-width: 3; }
      .nllayer { fill: #FFF3E0; stroke: #EF6C00; stroke-width: 3; }
      .engine { fill: #F3E5F5; stroke: #6A1B9A; stroke-width: 3; }
      .vault { fill: #FAFAFA; stroke: #9E9E9E; stroke-width: 3; }
      .external { fill: #FFFDE7; stroke: #F57F17; stroke-width: 3; }
      .database { fill: #E1F5FE; stroke: #01579B; stroke-width: 3; }
      .text { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #212121; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: bold; fill: #212121; }
      .arrow { fill: none; stroke: #757575; stroke-width: 3; marker-end: url(#arrowhead); }
    ]]></style>
    <marker id="arrowhead" markerWidth="12" markerHeight="9" refX="12" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#757575" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="60" class="title" text-anchor="middle">FlowForge System Architecture</text>

  <!-- Frontend (React) -->
  <rect x="100" y="120" width="260" height="120" class="box frontend" />
  <text x="230" y="180" class="text" text-anchor="middle">Frontend (HTML/CSS/JS)</text>
  <text x="230" y="210" class="text" text-anchor="middle">User builds/views workflows</text>

  <!-- Backend API (Express) -->
  <rect x="470" y="120" width="260" height="120" class="box backend" />
  <text x="600" y="180" class="text" text-anchor="middle">Backend API (Django)</text>
  <text x="600" y="210" class="text" text-anchor="middle">Handles workflow CRUD, NL parsing, execution</text>

  <!-- NL Parser / LLM layer (using free provider like Groq or NVIDIA NIM) -->
  <rect x="840" y="100" width="320" height="120" class="box nllayer" />
  <text x="1000" y="160" class="text" text-anchor="middle">NL Parser / LLM layer</text>
  <text x="1000" y="190" class="text" text-anchor="middle">(Free provider: Groq or NVIDIA NIM)</text>

  <!-- Workflow Execution Engine -->
  <rect x="840" y="260" width="320" height="120" class="box engine" />
  <text x="1000" y="320" class="text" text-anchor="middle">Workflow Execution Engine</text>
  <text x="1000" y="350" class="text" text-anchor="middle">Runs scheduled/triggered workflows</text>

  <!-- Credential Vault -->
  <rect x="840" y="420" width="320" height="120" class="box vault" />
  <text x="1000" y="480" class="text" text-anchor="middle">Credential Vault</text>
  <text x="1000" y="510" class="text" text-anchor="middle">Stores integration secrets (referenced by ID)</text>

  <!-- External Integrations -->
  <rect x="100" y="400" width="320" height="120" class="box external" />
  <text x="260" y="460" class="text" text-anchor="middle">External Integrations</text>
  <text x="260" y="490" class="text" text-anchor="middle">ERP portals, WhatsApp/Telegram/Email/SMS, HTTP/webhook</text>

  <!-- Database -->
  <rect x="470" y="400" width="260" height="120" class="box database" />
  <text x="600" y="460" class="text" text-anchor="middle">Database</text>
  <text x="600" y="490" class="text" text-anchor="middle">Stores workflow definitions, run history, user data</text>

  <!-- Arrows -->
  <!-- Frontend to Backend -->
  <line x1="360" y1="180" x2="470" y2="180" class="arrow" />
  <!-- Backend to NL Parser -->
  <line x1="730" y1="180" x2="840" y2="160" class="arrow" />
  <!-- Backend to Execution Engine (for scheduling) -->
  <line x1="730" y1="240" x2="840" y2="320" class="arrow" />
  <!-- NL Parser to Execution Engine -->
  <line x1="1000" y1="220" x2="1000" y2="260" class="arrow" />
  <!-- Execution Engine to Credential Vault -->
  <line x1="1000" y1="380" x2="1000" y2="420" class="arrow" />
  <!-- Execution Engine to External Integrations -->
  <line x1="840" y1="380" x2="420" y2="460" class="arrow" />
  <!-- Execution Engine to Database -->
  <line x1="1000" y1="380" x2="730" y2="460" class="arrow" />
  <!-- External Integrations to Execution Engine (webhooks) -->
  <line x1="420" y1="520" x2="840" y2="380" class="arrow" />
  <!-- Database to Execution Engine (scheduled) -->
  <line x1="730" y1="520" x2="840" y2="380" class="arrow" />
</svg>
